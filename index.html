<title>Equipe Sérgio | Vendas Online</title>
<style>
:root{--navy:#0B2545;--navy2:#13386b;--green:#167a42;--gt:#167a42;--gold:#C9A24B;--bg:#F1F4F8;--sf:#fff;--tx:#14213a;--mu:#56627a;--ln:#dde4ee;--soft:#e8f5ee;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--navy:#07172e;--bg:#0c1524;--sf:#14203a;--tx:#e8eef9;--mu:#9fb0cc;--ln:#25344f;--soft:#12301f;--gt:#5fd197}}
:root[data-theme="dark"]{color-scheme:dark;--navy:#07172e;--bg:#0c1524;--sf:#14203a;--tx:#e8eef9;--mu:#9fb0cc;--ln:#25344f;--soft:#12301f;--gt:#5fd197}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:19}
a{color:inherit}button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);border-bottom:3px solid var(--gold)}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 12px;max-width:1100px;margin:0 auto}
.brand{color:#fff;text-decoration:none;font-weight:800;font-size:15px;line-height:1.1;white-space:nowrap}
.brand small{display:block;color:var(--gold);font-weight:600;font-size:11px}
.search{flex:1;display:flex;background:#fff;border-radius:10px;overflow:hidden;min-width:0}
.search input{flex:1;min-width:0;border:0;padding:11px 12px;font-size:16px;color:#14213a;background:#fff}
.search button{border:0;background:var(--green);color:#fff;padding:0 14px;font-size:18px;cursor:pointer}
.cb{position:relative;color:#fff;text-decoration:none;font-size:24px;padding:4px 6px}
.bdg{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#0B2545;border-radius:99px;min-width:18px;height:18px;font:700 11px/18px sans-serif;text-align:center;padding:0 4px}
.bdg[hidden]{display:none}
main{max-width:1100px;margin:0 auto}
.ban{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ban::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;gap:12px;padding:16px;min-height:170px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2))}
.slide.green{background:linear-gradient(135deg,#0f5c32,#167a42)}
.slide.gold{background:linear-gradient(135deg,#d9bb6b,#C9A24B);color:#1b1500}
.slide div{flex:1}.slide h2{margin:0 0 6px;font-size:21px;line-height:1.15}.slide p{margin:0 0 10px;font-size:14px}
.slide img{width:36%;max-width:190px;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#fff}
.sbtn{display:inline-block;background:#fff;color:#0B2545;border-radius:99px;padding:9px 15px;font-weight:700;font-size:14px}
.dots{display:flex;justify-content:center;gap:6px;padding:8px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--ln)}.dots i.on{background:var(--green);width:18px}
.crow{display:flex;gap:4px;overflow-x:auto;padding:10px 8px;scrollbar-width:none}
.cat{flex:0 0 78px;text-align:center;background:none;border:0;color:var(--tx);font-size:12px;font-weight:600;cursor:pointer;padding:0}
.cat span{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 4px;border-radius:50%;background:var(--sf);border:2px solid var(--ln);font-size:24px}
.cat[aria-pressed="true"] span{border-color:var(--green);background:var(--soft)}
.blk{padding:6px 8px 14px}.blk h2{font-size:20px;margin:6px 4px 2px}.sub{margin:0 4px 10px;color:var(--mu);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card>a{text-decoration:none;color:inherit}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#fff}
.ci{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.ci h3{font-size:14px;font-weight:600;margin:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:800;font-size:19px;color:var(--gt)}
.tag{align-self:flex-start;font-size:11px;font-weight:700;background:var(--soft);color:var(--gt);border-radius:6px;padding:2px 7px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px;min-height:46px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;background:var(--green);color:#fff;width:100%}
.btn.o{background:transparent;color:var(--tx);border:2px solid var(--ln)}
.btn.w{background:#25D366;color:#073b1b}
.ci .btn{margin-top:auto;font-size:14px;padding:10px;min-height:42px}
.empty,.how article{background:var(--sf);border:1px dashed var(--ln);border-radius:12px;padding:16px;color:var(--mu);font-size:14px}
.how{display:grid;gap:8px;padding:0 4px}.how b{color:var(--tx);display:block}
@media(min-width:700px){.how{grid-template-columns:repeat(3,1fr)}}
.gw{position:relative;max-width:640px;margin:0 auto;background:#fff}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal img{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1;object-fit:contain;max-height:72vh}
.gc{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px}
.ptop{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}
.rb{position:relative;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:22px;text-decoration:none}
.box{background:var(--sf);padding:14px 16px;margin-top:8px}
.box h1{font-size:19px;line-height:1.25;margin:8px 0}.box h2{font-size:16px;margin:0 0 8px}
.big{font-size:30px;font-weight:800;color:var(--gt)}
.note{color:var(--mu);font-size:13px}
.cep{display:flex;gap:8px}.cep input{flex:1;min-width:0;padding:11px;font-size:16px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
.cep button{border:0;background:var(--navy);color:#fff;border-radius:8px;padding:0 16px;font-weight:700;cursor:pointer;min-height:44px}
#cepr{margin-top:8px;font-size:14px}
dl{margin:0}dt{font-weight:700;font-size:14px}dd{margin:0 0 8px;color:var(--mu);font-size:14px}
.sp{display:grid;grid-template-columns:42% 1fr;gap:4px 8px;font-size:14px}.sp div:nth-child(odd){color:var(--mu)}
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.buybar>*{flex:1;min-height:54px;border:0;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none}
.bchat{flex:0 0 78px!important;background:#25D366;color:#073b1b;flex-direction:column;font-size:12px!important}
.badd{background:var(--navy);color:#fff}.bbuy{background:var(--green);color:#fff}
body.pp{padding-bottom:70px}body.pp .tabs,body.pp .wafl{display:none}
.line{display:flex;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:8px}
.line img{width:76px;height:76px;object-fit:cover;border-radius:8px;background:#fff}
.line>div{flex:1}.qty{display:flex;align-items:center;gap:10px;margin-top:6px}
.qty button{width:38px;height:38px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:18px;cursor:pointer}
.rm{background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;font-size:13px;margin-left:auto}
.wafl{position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:24;background:#25D366;color:#073b1b;border-radius:99px;padding:12px 16px;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sf);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;text-decoration:none;font-size:12px;font-weight:600;gap:1px}
.tabs a span{font-size:21px;line-height:1}
footer{max-width:1100px;margin:8px auto 0;padding:16px;color:var(--mu);font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border:1px solid var(--gold);padding:11px 16px;border-radius:12px;font-size:14px;max-width:90vw;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(min-width:860px){.tabs{display:none}body{padding-bottom:0}.wafl{bottom:20px}.pp-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;padding:12px}}

var $=function(s){return document.querySelector(s)};
var cat="Todos",term="",termRaw="",cart={};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function brl(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function byId(id){for(var i=0;i<PRODUCTS.length;i++)if(PRODUCTS[i].id===id)return PRODUCTS[i];return null}
function wa(t){return "https://wa.me/"+CONFIG.WA+"?text="+encodeURIComponent(t)}
function waProd(p){return wa("Olá! Tenho interesse em: "+p.name+"\nQuantidade: 1\nPreço no site: "+brl(p.price)+"\nPode confirmar disponibilidade, frete e prazo?")}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},2400)}
try{var raw=JSON.parse(localStorage.getItem("sergio-cart")||"{}");Object.keys(raw).forEach(function(k){var n=Math.floor(Number(raw[k]));if(byId(k)&&n>0)cart[k]=Math.min(n,99)})}catch(e){cart={}}
function count(){return Object.keys(cart).reduce(function(a,k){return a+cart[k]},0)}
function total(){return Object.keys(cart).reduce(function(a,k){return a+cart[k]*byId(k).price},0)}
function save(){try{localStorage.setItem("sergio-cart",JSON.stringify(cart))}catch(e){}var n=count();["#cc","#tc"].forEach(function(s){$(s).textContent=n;$(s).hidden=!n})}
function add(id,quiet){cart[id]=Math.min(99,(cart[id]||0)+1);save();if(!quiet)toast("Adicionado ao carrinho")}
function card(p){return '<article class="card"><a href="#produto-'+p.id+'"><img src="'+p.imgs[0]+'" alt="'+esc(p.name)+' (imagem ilustrativa)" loading="lazy" width="400" height="400"></a><div class="ci"><a href="#produto-'+p.id+'"><h3>'+esc(p.name)+'</h3></a><span class="tag">Sob encomenda</span><div class="price">'+brl(p.price)+'</div><button class="btn" data-add="'+p.id+'">Adicionar ao carrinho</button></div></article>'}
function banners(){var s=CONFIG.BANNERS.map(function(b){var p=b.img&&byId(b.img);var l=b.link==="wa"?wa("Olá! Vim pela loja Equipe Sérgio | Vendas Online e gostaria de atendimento."):b.link;return '<a class="slide '+(b.cor||"")+'" href="'+l+'"'+(b.link==="wa"?' target="_blank" rel="noopener"':"")+'><div><h2>'+esc(b.titulo)+'</h2><p>'+esc(b.texto)+'</p><span class="sbtn">'+esc(b.botao)+'</span></div>'+(p?'<img src="'+p.imgs[0]+'" alt="">':"")+'</a>'}).join("");return '<div class="ban" id="ban" aria-label="Destaques">'+s+'</div><div class="dots" id="dots">'+CONFIG.BANNERS.map(function(_,i){return '<i'+(i?"":' class="on"')+'></i>'}).join("")+'</div>'}
function cats(){var l=["Todos"];PRODUCTS.forEach(function(p){if(l.indexOf(p.cat)<0)l.push(p.cat)});return l.map(function(c){return '<button class="cat" data-cat="'+esc(c)+'" aria-pressed="'+(c===cat)+'"><span>'+(c==="Todos"?"🛍️":CONFIG.ICONES[c]||"📦")+'</span>'+esc(c)+'</button>'}).join("")}
function home(){
 var list=PRODUCTS.filter(function(p){return(cat==="Todos"||p.cat===cat)&&(!term||norm(p.name+" "+p.cat).indexOf(term)>-1)});
 var h=(!term&&cat==="Todos")?banners():"";
 h+='<nav class="crow" id="crow" aria-label="Categorias">'+cats()+'</nav><section class="blk" id="catalogo"><h2>'+(term?"Resultados da busca":cat==="Todos"?"Produtos":esc(cat))+'</h2><p class="sub">'+list.length+" produto(s)"+(term?" para “"+esc(termRaw)+"”":"")+". Todos sob encomenda.</p>"+(list.length?'<div class="grid">'+list.map(card).join("")+"</div>":'<div class="empty">Nenhum produto encontrado. Tente outra palavra ou outra categoria.</div>')+'</section><section class="blk"><h2>Como comprar</h2><div class="how"><article><b>1. Escolha</b>Adicione os produtos ao carrinho.</article><article><b>2. Confirmamos</b>Disponibilidade, frete e prazo, antes de qualquer cobrança.</article><article><b>3. Pagamento e entrega</b>Combinado no atendimento. O pagamento online ainda não está ativo.</article></div></section>';
 $("#app").innerHTML=h;
 var b=$("#ban");if(b)b.addEventListener("scroll",function(){var i=Math.round(b.scrollLeft/b.clientWidth);[].forEach.call($("#dots").children,function(d,j){d.className=j===i?"on":""})},{passive:true});
}
function frete(c){c=c.replace(/\D/g,"");if(c.length!==8)return{erro:"Digite um CEP com 8 números."};for(var i=0;i<CONFIG.FRETE.length;i++){var r=CONFIG.FRETE[i];if(r.valor!=null&&c>=r.de&&c<=r.ate)return{ok:r,cep:c}}return{pend:true,cep:c}}
function productPage(id){
 var p=byId(id);if(!p){location.hash="";return}
 document.body.classList.add("pp");
 var n=p.imgs.length;
 var rel=PRODUCTS.filter(function(x){return x.id!==id});
 var sp=p.specs.concat([["Marca",p.marca||"Não confirmada"],["Condição de venda","Sob encomenda"]]).map(function(r){return "<div>"+esc(r[0])+"</div><div>"+esc(r[1])+"</div>"}).join("");
 $("#app").innerHTML='<div class="pp-wrap"><div class="gw"><div class="gal" id="gal" tabindex="0" aria-label="Galeria de fotos">'+p.imgs.map(function(s,i){return '<img src="'+s+'" alt="'+esc(p.name)+', foto '+(i+1)+' (ilustrativa)">'}).join("")+'</div><span class="gc" id="gc">1/'+n+'</span><div class="ptop"><a class="rb" href="#" aria-label="Voltar">‹</a><a class="rb" href="#carrinho" aria-label="Carrinho">🛒</a></div></div><div>'+
 '<div class="box" style="margin-top:0"><div class="big">'+brl(p.price)+'</div><span class="tag">Venda sob encomenda</span><h1>'+esc(p.name)+'</h1><p class="note">Valor sujeito à confirmação de disponibilidade. Imagem ilustrativa.</p></div>'+
 '<div class="box"><h2>Frete e prazo</h2><form class="cep" id="cepf"><input id="cep" inputmode="numeric" maxlength="9" placeholder="Digite seu CEP" aria-label="CEP"><button type="submit">Calcular</button></form><div id="cepr" aria-live="polite"></div></div>'+
 '<div class="box"><h2>Estoque e variações</h2><dl><dt>Estoque</dt><dd>Sob encomenda. Disponibilidade confirmada antes da cobrança.</dd><dt>Variações</dt><dd>'+(p.variacoes.length?p.variacoes.map(esc).join(", "):"Nenhuma variação confirmada para este produto.")+'</dd></dl></div>'+
 '<div class="box"><h2>Descrição do fornecedor</h2><p class="note" style="font-size:14px;margin:0">'+(p.descricao?esc(p.descricao):"Descrição completa a cadastrar com os dados reais do fornecedor. Nada é inventado.")+'</p></div>'+
 '<div class="box"><h2>Especificações</h2><div class="sp">'+sp+'</div></div>'+
 '<div class="box"><h2>Avaliações</h2><p class="note" style="font-size:14px;margin:0">'+(p.avaliacoes.length?"":"Ainda não há avaliações verificadas.")+'</p></div></div></div>'+
 '<section class="blk"><h2>Produtos relacionados</h2><div class="grid" style="margin-top:8px">'+rel.map(card).join("")+'</div></section>'+
 '<div class="buybar"><a class="bchat" href="'+waProd(p)+'" target="_blank" rel="noopener">💬<span>WhatsApp</span></a><button class="badd" data-add="'+p.id+'">Adicionar ao carrinho</button><button class="bbuy" data-buy="'+p.id+'">Comprar agora</button></div>';
 var g=$("#gal");g.addEventListener("scroll",function(){$("#gc").textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+"/"+n},{passive:true});
 $("#cepf").addEventListener("submit",function(e){e.preventDefault();var r=frete($("#cep").value),o=$("#cepr");
  if(r.erro)o.textContent=r.erro;
  else if(r.ok)o.textContent="Frete "+brl(r.ok.valor)+(r.ok.prazoDias!=null?", prazo estimado de "+r.ok.prazoDias+" dia(s) útil(eis)":"")+". Estimativa, confirmada no pedido.";
  else o.innerHTML="Para o CEP "+r.cep.slice(0,5)+"-"+r.cep.slice(5)+", frete e prazo serão confirmados no atendimento (tabela de frete ainda não configurada). <a href=\""+wa("Olá! Quero confirmar frete e prazo de: "+p.name+" para o CEP "+r.cep)+"\" target=\"_blank\" rel=\"noopener\">Perguntar pelo WhatsApp</a>"});
}
function cartPage(){
 var ids=Object.keys(cart).filter(function(k){return cart[k]>0});
 var h='<div class="blk" style="max-width:720px;margin:0 auto"><h2>Seu carrinho</h2>';
 if(!ids.length)h+='<div class="empty">Seu carrinho está vazio. <a href="#catalogo">Ver produtos</a></div>';
 else{
  h+=ids.map(function(k){var p=byId(k);return '<div class="line"><img src="'+p.imgs[0]+'" alt=""><div><strong>'+esc(p.name)+'</strong><div class="price" style="font-size:16px">'+brl(p.price*cart[k])+'</div><div class="qty"><button data-qty="'+k+'" data-d="-1" aria-label="Diminuir">−</button><span aria-live="polite">'+cart[k]+'</span><button data-qty="'+k+'" data-d="1" aria-label="Aumentar">+</button><button class="rm" data-rm="'+k+'">Remover</button></div></div></div>'}).join("");
  var lines=ids.map(function(k){return cart[k]+"x "+byId(k).name+" — "+brl(cart[k]*byId(k).price)}).join("\n");
  h+='<div class="box" style="border-radius:10px"><div style="display:flex;justify-content:space-between"><span>Subtotal</span><strong>'+brl(total())+'</strong></div><p class="note">Frete e prazo confirmados no atendimento. Este valor é uma estimativa, o total final é confirmado no pedido.</p><a class="btn" target="_blank" rel="noopener" href="'+wa("Olá! Gostaria de confirmar disponibilidade, frete e valores destes produtos:\n"+lines+"\nSubtotal estimado: "+brl(total())+"\nAinda não efetuei pagamento.")+'">Enviar pedido pelo WhatsApp</a><p class="note">Nenhuma cobrança é feita aqui. O pagamento online será ativado após a integração segura.</p></div>';
 }
 $("#app").innerHTML=h+"</div>";
}
function route(){
 var h=location.hash.slice(1);document.body.classList.remove("pp");
 if(h==="carrinho"){cartPage();window.scrollTo(0,0)}
 else if(h.indexOf("produto-")===0){productPage(h.slice(8));window.scrollTo(0,0)}
 else{home();var t=h==="categorias"?$("#crow"):h==="catalogo"?$("#catalogo"):null;if(t)t.scrollIntoView();else window.scrollTo(0,0)}
}
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-add],[data-buy],[data-cat],[data-qty],[data-rm]");if(!t)return;var d=t.dataset;
 if(d.add){add(d.add);return}
 if(d.buy){add(d.buy,true);location.hash="carrinho";return}
 if(d.cat){cat=d.cat;home();return}
 if(d.qty){cart[d.qty]=Math.max(0,Math.min(99,cart[d.qty]+Number(d.d)));if(!cart[d.qty])delete cart[d.qty];save();cartPage();return}
 if(d.rm){delete cart[d.rm];save();cartPage()}
});
$("#q").addEventListener("input",function(e){termRaw=e.target.value.trim();term=norm(termRaw);if(location.hash&&location.hash!=="#"){location.hash=""}else home()});
$("#sf").addEventListener("submit",function(e){e.preventDefault();$("#q").blur();var c=$("#catalogo");if(c)c.scrollIntoView()});
$("#waf").href=$("#tw").href=wa("Olá! Vim pela loja Equipe Sérgio | Vendas Online e gostaria de atendimento.");
window.addEventListener("hashchange",route);save();route();
</script>
